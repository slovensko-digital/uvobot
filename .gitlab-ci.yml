stages:
  - test
  - build

variables:
  BUNDLE_PATH: vendor/bundle

rspec:
  stage: test
  image: ruby:4.0.9-slim
  cache:
    key: bundler-$CI_COMMIT_REF_SLUG
    paths:
      - vendor/bundle/
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends build-essential libpq-dev
    - bundle install --jobs $(nproc)
  script:
    - bundle exec rspec
    - CI=1 RAILS_ENV=test bundle exec rails runner 'puts "boot ok"'

docker-build:
  stage: build
  image: docker:stable
  services:
    - docker:stable-dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
  script:
    - docker build -t uvobot:$CI_COMMIT_SHORT_SHA .
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
