name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.9
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rspec

      - name: Verify app boots (eager loading)
        env:
          CI: "1"
          RAILS_ENV: test
        run: bundle exec rails runner 'puts "boot ok"'
